% tectonic-watch draft fonts: only active in the extension's draft builds, via -Z search-path; the document is not modified
\ProvidesExplFile{ctexopts.cfg}{2026/09/29}{1.0}{tectonic-watch draft fontset}
\iow_log:n { tectonic-watch:~draft-fontset~active }
\tl_gset:Nn \g__ctex_fontset_tl { fandol }
\keys_define:nn { ctex / option }
  {
    fontset .code:n =
      {
        \iow_log:n { tectonic-watch:~requested-fontset=#1 }
        \tl_gset:Nn \g__ctex_fontset_tl { fandol }
      }
  }
% Draft marker: a document can test \ifdefined\TectonicWatchDraft to switch to something faster in draft builds,
% e.g. pre-rendered figure PDFs instead of typesetting TikZ. The macro does not exist in final builds
\cs_gset_nopar:Npn \TectonicWatchDraft { }
% Draft PDFs use the lowest compression level: for documents with many figures most of the PDF generation time goes into compression.
% The file is about 10% larger; final builds keep the default compression
\AddToHook { shipout/firstpage } { \special { dvipdfmx:config~z~1 } }
